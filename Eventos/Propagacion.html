<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Bubbling y stopPropagation</title>
</head>
<body>
  <div id="containerPadre">
    <div id="contenedorHijo1">
      <button id="btn1">Botón 1</button>
      <button id="btn2">Botón 2</button>
      <button id="btn3">Botón 3</button>
      <button id="btn4">Botón 4</button>
    </div>
    <div id="contenedorHijo2">
      <button id="btn5">Botón 5</button>
      <button id="btn6">Botón 6</button>
      <button id="btn7">Botón 7</button>
      <button id="btn8">Botón 8</button>
    </div>
  </div>
  <script>
    window.onload = function() {
      document.getElementById("containerPadre").addEventListener("click", (e) => {
        console.log("Click en el padre");
      });

      document.getElementById("contenedorHijo1").addEventListener("click", (e) => {
        console.log("Click en el hijo");
      });

      document.getElementById("btn4").addEventListener("click", (e) => {
        console.log("Click en Botón 4");
        e.stopPropagation();
      });
    };
  </script>
</body>
</html>
